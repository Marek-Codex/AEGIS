name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run non-destructive validation
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Verify BAT entry point
        shell: cmd
        run: Install.bat -Help -NoColor

  powershell-7:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse and dry-run in PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\Install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count) {
            throw ($errors | ForEach-Object Message | Out-String)
          }
          .\Install.ps1 -Profile Modern -IncludeGroup Utilities -DryRun -Unattended -NoColor
