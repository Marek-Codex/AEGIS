name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run non-destructive validation
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Verify BAT entry point
        shell: cmd
        run: Install.bat -Help -NoColor

  powershell-7:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run non-destructive validation
        shell: pwsh
        run: .\tests\Validate.ps1
