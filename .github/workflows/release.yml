name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Build release archive and checksums
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'
          $stage = Join-Path $env:RUNNER_TEMP "AEGIS-$version"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item Install.ps1, Install.bat, AEGIS.txt, README.md, LICENSE -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "AEGIS-$version.zip"
          Get-FileHash "AEGIS-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  AEGIS-$version.zip" } |
            Set-Content "AEGIS-$version.sha256" -Encoding ASCII

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            AEGIS-${{ github.ref_name }}.zip
            AEGIS-${{ github.ref_name }}.sha256
